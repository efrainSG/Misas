<div class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="row card shadow" style="width: 450px;" >
        <div class="col-12 col-md-8 offset-md-2">
            <h5 class="card-title mt-4">Inicio de sesión</h5>
            <div class="card-body">
                <form [formGroup]="form">
                    <div class="form-group">
                        <label for="username">Nombre de usuario</label>
                        <input type="text" class="form-control" formControlName="username" id="username" placeholder="Enter username">
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" class="form-control" formControlName="password" id="password" placeholder="Enter password">
                    </div>
                    <button type="submit" class="btn btn-primary" [disabled]="!form.valid" (click)="login()">Iniciar sesión</button>
                </form>
            </div>
        </div>
    </div>
</div>
